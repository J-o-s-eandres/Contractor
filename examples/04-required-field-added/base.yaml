openapi: "3.0.0"
info:
  title: Invoices API — v1
  version: "1.0.0"
paths:
  /invoices:
    post:
      summary: Create an invoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_name, amount]
              properties:
                client_name:
                  type: string
                amount:
                  type: number
                tax_id:
                  type: string
      responses:
        "201":
          description: Created
