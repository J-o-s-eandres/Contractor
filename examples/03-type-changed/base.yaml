openapi: "3.0.0"
info:
  title: Payments API — v1
  version: "1.0.0"
paths:
  /payments:
    post:
      summary: Create a payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, currency]
              properties:
                amount:
                  type: string
                  description: Amount as string to avoid floating point
                currency:
                  type: string
      responses:
        "201":
          description: Created
