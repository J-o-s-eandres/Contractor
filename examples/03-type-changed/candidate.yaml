openapi: "3.0.0"
info:
  title: Payments API — v2
  version: "2.0.0"
paths:
  /payments:
    post:
      summary: Create a payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, currency]
              properties:
                amount:
                  type: number        # BREAKING: antes era string
                  description: Amount as number
                currency:
                  type: string
      responses:
        "201":
          description: Created
