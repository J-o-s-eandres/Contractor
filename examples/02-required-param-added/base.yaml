openapi: "3.0.0"
info:
  title: Products API — v1
  version: "1.0.0"
paths:
  /products:
    get:
      summary: List products
      parameters:
        - name: filter
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    name:
                      type: string
